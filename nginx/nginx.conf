# This file contains the active HTTP redirect and reusable rate-limit zone.
# The live VPS HTTPS proxy server is managed separately; add the location
# directives shown below to that server block after confirming its path.
limit_req_zone $binary_remote_addr zone=frameiq_limit:10m rate=5r/s;

# ── HTTP — redirects to HTTPS once certs are set up ───────────────────────────
server {
    listen 80;
    server_name frameiq.studio www.frameiq.studio;

    # Certbot ACME challenge (needed during SSL setup — leave this here always)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://frameiq.studio$request_uri;
    }
}


