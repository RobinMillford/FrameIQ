# ── SSL SETUP (run once on VPS after DNS propagates) ─────────────────────────
# 1. Make sure ports 80 + 443 are open in your VPS firewall
# 2. Stop nginx temporarily so certbot can bind port 80:
#       docker compose stop nginx
# 3. Run certbot:
#       certbot certonly --standalone -d frameiq.studio -d www.frameiq.studio
# 4. Copy certs:
#       cp /etc/letsencrypt/live/frameiq.studio/fullchain.pem nginx/ssl/
#       cp /etc/letsencrypt/live/frameiq.studio/privkey.pem   nginx/ssl/
# 5. Uncomment the HTTPS server block above
# 6. Restart:
#       docker compose up -d nginx
