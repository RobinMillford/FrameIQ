# ── HTTP — redirects to HTTPS once certs are set up ───────────────────────────
server {
    listen 80;
    server_name frameiq.studio www.frameiq.studio;

    # Certbot ACME challenge (needed during SSL setup — leave this here always)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://frameiq.studio$request_uri;
    }
}


