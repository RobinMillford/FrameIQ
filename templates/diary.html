<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>My Diary - FrameIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chrome.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/frameiq-brand.css') }}">
    <style>
        body {
            font-family: Inter, sans-serif;
            background-color:  var(--bg-base);
            color: #f5f6f5;
            min-height: 100vh;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .diary-container {
            max-width: 1000px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="pb-12">
    <!-- Navigation (shared chrome) -->
    {% with with_diary = true %}{% include "partials/nav_simple.html" %}{% endwith %}

    <div class="container mx-auto px-4">
        <div class="diary-container">
            <div class="mb-8">
                <h1 class="text-4xl font-bold text-[var(--text-hi)]" style="font-family: var(--font-display);">My Diary</h1>
                <p class="text-[var(--text-mid)]">Your chronological movie + TV watch events</p>
            </div>

            <!-- Filter Options -->
            <div class="glass-effect rounded-lg p-4 mb-6 flex flex-wrap gap-4">
                <select id="year-filter" class="bg-[var(--bg-elevated)] text-white px-4 py-2 rounded-lg border border-[var(--line-hi)]" aria-label="Filter by year">
                    <option value="">All Years</option>
                </select>
                <select id="month-filter" class="bg-[var(--bg-elevated)] text-white px-4 py-2 rounded-lg border border-[var(--line-hi)]" aria-label="Filter by month">
                    <option value="">All Months</option>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>

            <!-- Diary Entries -->
            <div id="diary-entries" class="space-y-4">
                <!-- Entries will be loaded here via JavaScript -->
                <div class="flex justify-center py-20">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-[var(--accent)]"></div>
                </div>
            </div>

            <!-- Load More -->
            <div class="text-center mt-8">
                <button id="load-more" class="bg-transparent border border-[var(--accent)] text-[var(--accent)] hover:bg-[var(--accent)] hover:text-black px-8 py-3 rounded-xl transition-all duration-300 hidden">
                    Load More
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let hasMore = true;

        async function loadDiaryEntries(page = 1, year = null, month = null) {
            try {
                let url = `/api/diary?page=${page}&per_page=20`;
                if (year) url += `&year=${year}`;
                if (month) url += `&month=${month}`;

                const response = await fetch(url);
                const data = await response.json();

                if (page === 1) {
                    document.getElementById('diary-entries').replaceChildren();
                }

                if (data.entries.length === 0 && page === 1) {
                    const wrap = document.createElement('div');
                    wrap.className = 'text-center py-20';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-book-open text-6xl text-[var(--text-mid)] mb-4';
                    const msg = document.createElement('p');
                    msg.className = 'text-[var(--text-mid)] text-lg';
                    msg.textContent = 'Your diary is empty. Start logging your watches!';
                    wrap.appendChild(icon);
                    wrap.appendChild(msg);
                    document.getElementById('diary-entries').appendChild(wrap);
                    return;
                }

                data.entries.forEach(entry => {
                    // Unified movie + TV stream (server merges DiaryEntry
                    // + TVEpisodeWatch). All dynamic values are untrusted
                    // — built with createElement/textContent, never HTML
                    // string interpolation.
                    const card = document.createElement('div');
                    card.className = 'glass-effect rounded-lg p-4 flex gap-4 hover:bg-white/10 transition-all';

                    const img = document.createElement('img');
                    if (entry.media.poster_path) {
                        img.src = 'https://image.tmdb.org/t/p/w200' + entry.media.poster_path;
                    }
                    img.alt = entry.media.title || 'Poster';
                    img.className = 'w-20 h-32 object-cover rounded';

                    const body = document.createElement('div');
                    body.className = 'flex-1';

                    const head = document.createElement('div');
                    head.className = 'flex justify-between items-start';

                    const left = document.createElement('div');

                    const title = document.createElement('h3');
                    title.className = 'text-lg font-semibold';
                    title.textContent = entry.media.title || 'Untitled';

                    const sub = document.createElement('p');
                    sub.className = 'text-sm text-[var(--text-mid)]';
                    const when = entry.watched_date
                        ? new Date(entry.watched_date).toLocaleDateString()
                        : '';
                    if (entry.episode) {
                        sub.textContent = 'S' + entry.episode.season +
                            'E' + entry.episode.number +
                            ' \u00b7 Watched on ' + when;
                    } else {
                        sub.textContent = 'Watched on ' + when;
                    }

                    left.appendChild(title);
                    left.appendChild(sub);

                    if (entry.is_rewatch) {
                        const tag = document.createElement('span');
                        tag.className = 'text-xs bg-yellow-600 text-white px-2 py-1 rounded mt-1 inline-block';
                        tag.textContent = 'Rewatch';
                        left.appendChild(tag);
                    }

                    head.appendChild(left);

                    if (entry.rating) {
                        const stars = document.createElement('div');
                        stars.className = 'text-yellow-400 text-lg';
                        stars.textContent = '\u2605 ' + entry.rating;
                        head.appendChild(stars);
                    }

                    body.appendChild(head);
                    card.appendChild(img);
                    card.appendChild(body);
                    document.getElementById('diary-entries').appendChild(card);
                });

                hasMore = data.has_next;
                document.getElementById('load-more').classList.toggle('hidden', !hasMore);

            } catch (error) {
                const wrap = document.createElement('div');
                wrap.className = 'text-center py-20 text-red-400';
                const msg = document.createElement('p');
                msg.textContent = 'Error loading diary entries. Please try again.';
                wrap.appendChild(msg);
                document.getElementById('diary-entries').appendChild(wrap);
            }
        }

        // Load initial entries
        loadDiaryEntries();

        // Filter handlers
        document.getElementById('year-filter').addEventListener('change', (e) => {
            currentPage = 1;
            const year = e.target.value;
            const month = document.getElementById('month-filter').value;
            loadDiaryEntries(1, year || null, month || null);
        });

        document.getElementById('month-filter').addEventListener('change', (e) => {
            currentPage = 1;
            const year = document.getElementById('year-filter').value;
            const month = e.target.value;
            loadDiaryEntries(1, year || null, month || null);
        });

        // Load more handler
        document.getElementById('load-more').addEventListener('click', () => {
            currentPage++;
            const year = document.getElementById('year-filter').value;
            const month = document.getElementById('month-filter').value;
            loadDiaryEntries(currentPage, year || null, month || null);
        });
    </script>
    <script src="{{ url_for('static', filename='js/chrome.js') }}"></script>
</body>
</html>
