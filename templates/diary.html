<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>My Diary - FrameIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chrome.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/frameiq-brand.css') }}">
    <style>
        body {
            font-family: Inter, sans-serif;
            background-color:  var(--bg-base);
            color: #f5f6f5;
            min-height: 100vh;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .diary-container {
            max-width: 1000px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="pb-12">
    <!-- Navigation (shared chrome) -->
    {% with with_diary = true %}{% include "partials/nav_simple.html" %}{% endwith %}

    <div class="container mx-auto px-4">
        <div class="diary-container">
            <header class="mb-5">
                <h1 class="text-2xl font-bold text-[var(--text-hi)]" style="font-family: var(--font-display);">My Diary</h1>
                <p class="mt-0.5 text-sm text-[var(--text-mid)]">Your chronological movie + TV watch history</p>
            </header>

            <!-- Compact filters. #year-filter is populated from the years
                 actually present in the loaded pages (it previously shipped
                 with only "All Years" and was dead UI). -->
            <div class="mb-4 flex flex-wrap items-center gap-2">
                <label class="sr-only" for="year-filter">Filter by year</label>
                <select id="year-filter"
                        class="rounded border border-[var(--line-hi)] bg-[var(--bg-elevated)] px-2.5 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
                    <option value="">All years</option>
                </select>
                <label class="sr-only" for="month-filter">Filter by month</label>
                <select id="month-filter"
                        class="rounded border border-[var(--line-hi)] bg-[var(--bg-elevated)] px-2.5 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
                    <option value="">All months</option>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <p id="diary-summary" class="text-xs text-[var(--text-mid)]" role="status" aria-live="polite"></p>
            </div>

            <!-- Entries are grouped by watched_date, then TV episodes for the
                 same show on that date collapse into one <details> group.
                 Every individual record stays in the DOM and reachable. -->
            <div id="diary-entries" class="flex flex-col">
                <div class="flex justify-center py-16">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-[var(--accent)]"></div>
                </div>
            </div>

            <div class="mt-6 text-center">
                <button id="load-more"
                        class="rounded border border-[var(--accent)] px-6 py-2 text-sm text-[var(--accent)] transition-all duration-300 hover:bg-[var(--accent)] hover:text-black focus:outline-none focus:ring-2 focus:ring-[var(--accent)] hidden">
                    Load more
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var PAGE_SIZE = 20;
            var entriesEl = document.getElementById('diary-entries');
            var loadMoreBtn = document.getElementById('load-more');
            var yearEl = document.getElementById('year-filter');
            var monthEl = document.getElementById('month-filter');
            var summaryEl = document.getElementById('diary-summary');

            var currentPage = 1;
            var loading = false;
            var seenYears = {};
            var seenTotal = 0;

            function mediaUrl(entry) {
                var mt = entry.media.media_type === 'tv' ? 'tv' : 'movie';
                return '/' + mt + '/' + entry.media.id;
            }

            function posterImg(entry, cls) {
                var img = document.createElement('img');
                img.loading = 'lazy';
                if (entry.media.poster_path) {
                    img.src = 'https://image.tmdb.org/t/p/w200' + entry.media.poster_path;
                } else {
                    img.src = '/static/images/no-poster.svg';
                }
                img.alt = '';
                img.className = cls;
                return img;
            }

            function ratingNode(entry) {
                if (!entry.rating) return null;
                var s = document.createElement('span');
                s.className = 'ml-auto shrink-0 text-xs text-yellow-400';
                s.textContent = '\u2605 ' + entry.rating;
                return s;
            }

            function rewatchTag() {
                var t = document.createElement('span');
                t.className = 'shrink-0 rounded bg-yellow-600/80 px-1.5 py-0.5 text-[10px] text-white';
                t.textContent = 'Rewatch';
                return t;
            }

            /* Compact movie row. */
            function movieRow(entry) {
                var a = document.createElement('a');
                a.href = mediaUrl(entry);
                a.className = 'flex items-center gap-3 border-b border-[var(--line)]/60 py-2 transition-colors hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]';

                a.appendChild(posterImg(entry, 'h-16 w-10 shrink-0 rounded object-cover'));

                var mid = document.createElement('div');
                mid.className = 'min-w-0 flex-1';
                var t = document.createElement('p');
                t.className = 'truncate text-sm font-medium text-[var(--text-hi)]';
                t.textContent = entry.media.title || 'Untitled';
                var s = document.createElement('p');
                s.className = 'text-xs text-[var(--text-mid)]';
                s.textContent = 'Movie';
                mid.appendChild(t);
                mid.appendChild(s);

                var right = document.createElement('div');
                right.className = 'flex shrink-0 items-center gap-2';
                if (entry.is_rewatch) right.appendChild(rewatchTag());
                var r = ratingNode(entry);
                if (r) right.appendChild(r);

                a.appendChild(mid);
                a.appendChild(right);
                return a;
            }

            /* One collapsible group of episodes for a single show on a single
               recorded date. Uses <details> so it is keyboard operable, exposes
               correct expanded state, and keeps every episode reachable. */
            function tvGroup(showEntries, dateLabel) {
                var first = showEntries[0];
                var details = document.createElement('details');
                details.className = 'border-b border-[var(--line)]/60 py-2';

                var summary = document.createElement('summary');
                summary.className = 'flex cursor-pointer list-none items-center gap-3 rounded transition-colors hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]';

                summary.appendChild(posterImg(first, 'h-16 w-10 shrink-0 rounded object-cover'));

                var mid = document.createElement('div');
                mid.className = 'min-w-0 flex-1';
                var t = document.createElement('p');
                t.className = 'truncate text-sm font-medium text-[var(--text-hi)]';
                t.textContent = first.media.title || 'Unknown Show';
                var s = document.createElement('p');
                s.className = 'text-xs text-[var(--text-mid)]';
                var n = showEntries.length;
                s.textContent = n + (n === 1 ? ' episode' : ' episodes') +
                    ' \u00b7 ' + dateLabel;
                mid.appendChild(t);
                mid.appendChild(s);
                summary.appendChild(mid);

                var right = document.createElement('div');
                right.className = 'flex shrink-0 items-center gap-2';
                if (showEntries.some(function (e) { return e.is_rewatch; })) {
                    right.appendChild(rewatchTag());
                }
                summary.appendChild(right);
                details.appendChild(summary);

                var ul = document.createElement('ul');
                ul.className = 'ml-[3.25rem] mt-1.5 space-y-1';
                showEntries.forEach(function (entry) {
                    var li = document.createElement('li');
                    var a = document.createElement('a');
                    a.href = mediaUrl(entry);
                    a.className = 'flex items-center gap-2 rounded px-2 py-1 text-xs transition-colors hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]';

                    var code = document.createElement('span');
                    code.className = 'shrink-0 font-mono text-[var(--accent)]';
                    code.textContent = 'S' + entry.episode.season + 'E' +
                        String(entry.episode.number).padStart(2, '0');

                    var name = document.createElement('span');
                    name.className = 'min-w-0 flex-1 truncate text-[var(--text-hi)]';
                    name.textContent = entry.episode.name || 'Episode ' + entry.episode.number;

                    a.appendChild(code);
                    a.appendChild(name);
                    if (entry.is_rewatch) a.appendChild(rewatchTag());
                    var r = ratingNode(entry);
                    if (r) a.appendChild(r);

                    li.appendChild(a);
                    ul.appendChild(li);
                });
                details.appendChild(ul);
                return details;
            }

            function dateLabel(iso) {
                if (!iso) return '';
                var d = new Date(iso);
                if (isNaN(d)) return iso;
                return d.toLocaleDateString(undefined,
                    { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            }

            /* Render one page. Server order is (watched_date, created_at, kind,
               id) DESC, so same-date entries arrive adjacent; grouping here only
               ever merges rows that share a RECORDED watched_date. */
            function renderPage(data) {
                var entries = data.entries || [];
                var frag = document.createDocumentFragment();

                var i = 0;
                while (i < entries.length) {
                    var date = entries[i].watched_date;
                    var j = i;
                    while (j < entries.length && entries[j].watched_date === date) j++;
                    var block = entries.slice(i, j);

                    var movies = block.filter(function (e) { return !e.episode; });
                    var tvs = block.filter(function (e) { return e.episode; });

                    movies.forEach(function (e) { frag.appendChild(movieRow(e)); });

                    // Group TV by show within the day.
                    var order = [];
                    var byShow = {};
                    tvs.forEach(function (e) {
                        var key = e.media.id;
                        if (!byShow[key]) { byShow[key] = []; order.push(key); }
                        byShow[key].push(e);
                    });
                    order.forEach(function (key) {
                        frag.appendChild(tvGroup(byShow[key], dateLabel(date)));
                    });

                    i = j;
                }

                entriesEl.appendChild(frag);
                seenTotal += entries.length;
                entries.forEach(function (e) {
                    if (e.watched_date) seenYears[e.watched_date.slice(0, 4)] = true;
                });
                refreshYearOptions();
                summaryEl.textContent = seenTotal === 1
                    ? '1 entry'
                    : (seenTotal + ' entries loaded');
            }

            function refreshYearOptions() {
                var current = yearEl.value;
                var years = Object.keys(seenYears).sort(function (a, b) { return b - a; });
                if (!years.length) return;
                yearEl.replaceChildren();
                var all = document.createElement('option');
                all.value = '';
                all.textContent = 'All years';
                yearEl.appendChild(all);
                years.forEach(function (y) {
                    var o = document.createElement('option');
                    o.value = y;
                    o.textContent = y;
                    yearEl.appendChild(o);
                });
                yearEl.value = current;
            }

            function emptyState(message) {
                var wrap = document.createElement('div');
                wrap.className = 'py-16 text-center';
                var icon = document.createElement('i');
                icon.className = 'fas fa-book-open text-5xl text-[var(--text-mid)] mb-3';
                var msg = document.createElement('p');
                msg.className = 'text-[var(--text-mid)]';
                msg.textContent = message;
                wrap.appendChild(icon);
                wrap.appendChild(msg);
                entriesEl.appendChild(wrap);
            }

            async function loadDiaryEntries(page) {
                if (loading) return;
                loading = true;
                loadMoreBtn.disabled = true;
                try {
                    var year = yearEl.value || null;
                    var month = monthEl.value || null;
                    var url = '/api/diary?page=' + page + '&per_page=' + PAGE_SIZE;
                    if (year) url += '&year=' + encodeURIComponent(year);
                    if (month) url += '&month=' + encodeURIComponent(month);

                    var response = await fetch(url);
                    if (!response.ok) throw new Error('http ' + response.status);
                    var data = await response.json();

                    if (page === 1) {
                        entriesEl.replaceChildren();
                        seenTotal = 0;
                    }
                    if ((data.entries || []).length === 0 && page === 1) {
                        emptyState('Your diary is empty. Start logging your watches!');
                        loadMoreBtn.classList.add('hidden');
                        return;
                    }
                    renderPage(data);
                    loadMoreBtn.classList.toggle('hidden', !data.has_next);
                } catch (error) {
                    if (page === 1) {
                        entriesEl.replaceChildren();
                        var wrap = document.createElement('div');
                        wrap.className = 'py-16 text-center text-red-400';
                        var msg = document.createElement('p');
                        msg.textContent = 'Error loading diary entries. Please try again.';
                        wrap.appendChild(msg);
                        entriesEl.appendChild(wrap);
                    }
                } finally {
                    loading = false;
                    loadMoreBtn.disabled = false;
                }
            }

            function reload() {
                currentPage = 1;
                seenYears = {};
                loadDiaryEntries(1);
            }

            loadDiaryEntries(1);

            yearEl.addEventListener('change', reload);
            monthEl.addEventListener('change', reload);
            loadMoreBtn.addEventListener('click', function () {
                currentPage += 1;
                loadDiaryEntries(currentPage);
            });
        })();
    </script>
    <script src="{{ url_for('static', filename='js/chrome.js') }}"></script>
</body>
</html>
