{# Profile dropdown (authenticated users only).
   Params: with_diary — include the Diary link (optional, default false) #}
<div class="relative" id="profile-dropdown">
    <button id="profile-button" class="flex items-center space-x-1 text-white hover:text-gray-300">
        <i class="fas fa-user"></i>
        <span>{{ current_user.username }}</span>
        <i class="fas fa-caret-down"></i>
    </button>
    <div id="profile-menu" class="absolute right-0 mt-2 w-48  rounded-md shadow-lg py-1 hidden z-10">
        <a href="{{ url_for('auth.profile') }}" class="block px-4 py-2 text-sm hover:bg-gray-700">Profile</a>
        <a href="{{ url_for('main.watchlist') }}" class="block px-4 py-2 text-sm hover:bg-gray-700">Watchlist</a>
        <a href="{{ url_for('main.wishlist') }}" class="block px-4 py-2 text-sm hover:bg-gray-700">Wishlist</a>
        <a href="{{ url_for('main.viewed') }}" class="block px-4 py-2 text-sm hover:bg-gray-700">Viewed</a>
        {% if with_diary %}<a href="/diary" class="block px-4 py-2 text-sm hover:bg-gray-700">Diary</a>{% endif %}
        <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2 text-sm hover:bg-gray-700">Logout</a>
    </div>
</div>
