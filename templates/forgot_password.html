<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Forgot Password — FrameIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: white; min-height: 100vh; }
        .card { background: rgba(30,41,59,.8); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255,255,255,.1); max-width: 450px; width: 90%; margin: 5rem auto; padding: 2rem; }
        input { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; color: white; padding: .75rem 1rem; width: 100%; outline: none; transition: border .2s; }
        input:focus { border-color: #6366f1; }
        .btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 8px; padding: .75rem; width: 100%; font-weight: 600; cursor: pointer; border: none; color: white; transition: opacity .2s; }
        .btn:hover { opacity: .9; }
    </style>
</head>
<body>
<div class="card">
    <div class="text-center mb-6">
        <a href="/" class="text-indigo-400 font-bold text-2xl">FrameIQ</a>
        <h1 class="text-xl font-semibold mt-3">Forgot your password?</h1>
        <p class="text-gray-400 text-sm mt-1">Enter your email and we'll send a reset link.</p>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="mb-4 p-3 bg-indigo-900/50 border border-indigo-500/30 rounded-lg text-sm text-indigo-200">
        {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1">Email address</label>
            <input type="email" name="email" required placeholder="you@example.com" autofocus>
        </div>
        <button type="submit" class="btn">Send reset link</button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        Remembered it? <a href="/login" class="text-indigo-400 hover:text-indigo-300">Log in</a>
    </p>
</div>
</body>
</html>
