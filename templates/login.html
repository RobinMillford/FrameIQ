<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — FrameIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                base: '#0B0B10', surface: '#14141C', elevated: '#1C1C26',
                line: '#26262F', accent: '#F6B73C', 'accent-hi': '#FFD066',
                amber: '#FFB454',
            }, fontFamily: {
                display: ['"Bricolage Grotesque"', 'Inter', 'sans-serif'],
                body: ['Inter', 'sans-serif'],
                slate: ['"JetBrains Mono"', 'monospace'],
            }}},
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { background: var(--bg-base, #0B0B10); color: #F4F4F6;
               font-family: Inter, sans-serif; }
        .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.025; z-index: 1;
                 background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
        input:focus { border-color: #F6B73C !important; outline: none; }
        .flash-error { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.4);
                       color: #F87171; padding: 10px 14px; border-radius: 10px; font-size: .875rem; }
        .flash-msg { background: rgba(124,108,255,.12); border: 1px solid rgba(124,108,255,.4);
                     color: #F6B73C; padding: 10px 14px; border-radius: 10px; font-size: .875rem; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="grain" aria-hidden="true"></div>

    <div class="w-full max-w-[420px] relative z-10">
        <!-- Logo -->
        <div class="flex items-center gap-3 mb-8 justify-center">
            <svg class="w-7 h-7" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                <path d="M2 9V4a2 2 0 012-2h5" stroke="#fff" stroke-width="2.5"/>
                <path d="M19 2h5a2 2 0 012 2v5" stroke="#fff" stroke-width="2.5"/>
                <path d="M26 19v5a2 2 0 01-2 2h-5" stroke="#fff" stroke-width="2.5"/>
                <path d="M9 26H4a2 2 0 01-2-2v-5" stroke="#fff" stroke-width="2.5"/>
                <rect x="11" y="11" width="6" height="6" fill="#F6B73C"/>
            </svg>
            <span class="font-display font-black uppercase tracking-[0.18em] text-xl">FrameIQ</span>
        </div>

        <div class="bg-[var(--bg-surface,#14141C)] border border-[var(--line,#26262F)] rounded-2xl p-8">
            <h1 class="font-display font-bold text-2xl mb-1">Welcome back</h1>
            <p class="font-slate text-[11px] text-[#B3B3B3] mb-6">your taste, remembered</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="{{ 'flash-error' if 'error' in category else 'flash-msg' }} mb-4">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="/login" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="font-slate text-[10px] uppercase tracking-[0.12em] text-[#B3B3B3] block mb-1.5">Username</label>
                    <input type="text" name="username" required autofocus
                           class="w-full bg-[var(--bg-base,#0B0B10)] border border-[#26262F] rounded-[10px] px-4 py-3 text-sm text-white transition-colors"
                           placeholder="your username">
                </div>
                <div>
                    <label class="font-slate text-[10px] uppercase tracking-[0.12em] text-[#B3B3B3] block mb-1.5">Password</label>
                    <input type="password" name="password" required
                           class="w-full bg-[var(--bg-base,#0B0B10)] border border-[#26262F] rounded-[10px] px-4 py-3 text-sm text-white transition-colors"
                           placeholder="••••••••">
                </div>
                <button type="submit"
                        class="w-full bg-white text-black font-bold hover:bg-white/85 font-semibold py-3 rounded-[10px] transition-all hover:brightness-110 hover:-translate-y-px text-sm">
                    Log in
                </button>
            </form>

            <div class="flex items-center gap-3 my-6">
                <div class="h-px bg-[#26262F] flex-1"></div>
                <span class="font-slate text-[10px] text-[#B3B3B3]">OR</span>
                <div class="h-px bg-[#26262F] flex-1"></div>
            </div>

            <a href="/google/login" class="w-full flex items-center justify-center gap-3 bg-white/[0.06] hover:bg-white/[0.1] border border-[#26262F] text-white font-medium py-3 rounded-[10px] text-sm transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 010-4.2V7.06H2.18a11 11 0 000 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 002.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Continue with Google
            </a>
        </div>

        <p class="text-center mt-6 text-sm text-[#B3B3B3]">
            New to FrameIQ?
            <a href="/register" class="text-[#F6B73C] hover:text-white font-medium">Create an account</a>
        </p>
    </div>
</body>
</html>
