<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Reset Password — FrameIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chrome.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Inter, sans-serif; background: var(--bg-base); color: white; min-height: 100vh; }
        .card { background: rgba(30,41,59,.8); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255,255,255,.1); max-width: 450px; width: 90%; margin: 5rem auto; padding: 2rem; }
        input { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; color: white; padding: .75rem 1rem; width: 100%; outline: none; transition: border .2s; }
        input:focus { border-color: #6366f1; }
        .btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 8px; padding: .75rem; width: 100%; font-weight: 600; cursor: pointer; border: none; color: white; transition: opacity .2s; }
        .btn:hover { opacity: .9; }
        .hint { font-size: .75rem; color: #6b7280; margin-top: .25rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="text-center mb-6">
        <a href="/" class="text-[var(--accent)] font-bold text-2xl">FrameIQ</a>
        <h1 class="text-xl font-semibold mt-3">Choose a new password</h1>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="mb-4 p-3 bg-red-900/40 border border-red-500/30 rounded-lg text-sm text-red-200">
        {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
            <label class="block text-sm text-[var(--text-mid)] mb-1">New password</label>
            <input type="password" name="password" required placeholder="Min 8 chars, upper + lower + digit" autofocus>
            <p class="hint">At least 8 characters, one uppercase, one lowercase, one digit.</p>
        </div>
        <div class="mb-6">
            <label class="block text-sm text-[var(--text-mid)] mb-1">Confirm new password</label>
            <input type="password" name="confirm_password" required placeholder="Repeat password">
        </div>
        <button type="submit" class="btn">Reset password</button>
    </form>
</div>
    <script src="{{ url_for('static', filename='js/chrome.js') }}"></script>
</body>
</html>
