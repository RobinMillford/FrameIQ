name: frameiq   # unique project name — isolates from other compose stacks on VPS

services:

  web:
    build: .
    image: frameiq-app:latest
    restart: unless-stopped
    environment:
      # ── Database (Neon — passed from .env) ────────────────────────────────
      DATABASE_URL: ${DATABASE_URL}

      # ── App ────────────────────────────────────────────────────────────────
      SECRET_KEY: ${SECRET_KEY}
      FLASK_DEBUG: "false"

      # ── Gunicorn (override in .env if needed) ──────────────────────────────
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-4}

      # ── External APIs ──────────────────────────────────────────────────────
      TMDB_API_KEY: ${TMDB_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHROMA_API_KEY: ${CHROMA_API_KEY}
      CHROMA_TENANT: ${CHROMA_TENANT}
      CHROMA_DATABASE: ${CHROMA_DATABASE}

      # ── Google OAuth ───────────────────────────────────────────────────────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # ── Cloudinary ─────────────────────────────────────────────────────────
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # ── Email (optional) ───────────────────────────────────────────────────
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@frameiq.studio}
    expose:
      - "8080"
    networks:
      - frameiq

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP  → redirects to HTTPS
      - "443:443"    # HTTPS → frameiq.studio
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - frameiq

volumes:
  nginx_logs:
  certbot_www:

networks:
  frameiq:
    driver: bridge
