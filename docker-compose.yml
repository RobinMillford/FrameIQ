name: frameiq

services:

  valkey:
    image: valkey/valkey:8-alpine
    # Shared Flask-Limiter storage (multi-worker counter correctness).
    # NO persistence: limiter windows are disposable state; on restart they
    # reset exactly as the previous memory:// per-process counters did.
    # allkeys-lru: under memory pressure evict oldest limiter windows
    # (degrades to a wider window, never blocks serving — see fallback).
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save "" --appendonly no
    environment:
      # For the healthcheck shell (valkey-cli -a $VALKEY_PASSWORD) only.
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    restart: unless-stopped
    # Internal network only — deliberately NOT in `ports:`; 6379 is never
    # reachable from the host, Nginx, or the internet.
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - frameiq

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frameiq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bind to loopback only: the app reaches Postgres over the internal
    # 'frameiq' network; host access is rarely needed and exposing 5432 on
    # 0.0.0.0 is an internet-wide attack surface. Set POSTGRES_EXPOSED_PORT
    # to "127.0.0.1:5432" in .env if you temporarily need host access.
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frameiq

  web:
    build: .
    image: frameiq-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8080"
    environment:
      # Shared limiter storage — set in production .env; when unset the app
      # uses per-process memory:// exactly as before (dev/CI unchanged).
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frameiq}
      APP_ENV: "production"
      SECRET_KEY: ${SECRET_KEY}
      FLASK_DEBUG: "false"
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
      TMDB_API_KEY: ${TMDB_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@frameiq.studio}
    volumes:
      - chat_memory:/app/instance
    networks:
      - frameiq

volumes:
  pgdata:
  chat_memory:

networks:
  frameiq:
    driver: bridge
