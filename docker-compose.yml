name: frameiq   # unique project name — isolates from other compose stacks on VPS

services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: frameiq
      POSTGRES_USER: frameiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frameiq

  web:
    build: .
    image: frameiq-app:latest        # explicit name makes clean rebuilds easy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── Database ───────────────────────────────────────────────────────────
      # Points to the local postgres container.
      # To use Neon instead, set DATABASE_URL in .env and remove this line.
      DATABASE_URL: postgresql://frameiq:${POSTGRES_PASSWORD}@db:5432/frameiq

      # ── App ────────────────────────────────────────────────────────────────
      SECRET_KEY: ${SECRET_KEY}
      FLASK_DEBUG: "false"

      # ── Gunicorn (override in .env if needed) ──────────────────────────────
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-4}

      # ── External APIs ──────────────────────────────────────────────────────
      TMDB_API_KEY: ${TMDB_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHROMA_API_KEY: ${CHROMA_API_KEY}
      CHROMA_TENANT: ${CHROMA_TENANT}
      CHROMA_DATABASE: ${CHROMA_DATABASE}

      # ── Google OAuth ───────────────────────────────────────────────────────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # ── Cloudinary ─────────────────────────────────────────────────────────
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # ── Email (optional) ───────────────────────────────────────────────────
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@frameiq.studio}
    expose:
      - "8080"
    networks:
      - frameiq

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP  → redirects to HTTPS
      - "443:443"    # HTTPS → frameiq.studio
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro   # certbot ACME challenge files
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - frameiq

volumes:
  postgres_data:
  nginx_logs:
  certbot_www:

networks:
  frameiq:
    driver: bridge
