name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov flake8

      - name: Lint (errors only)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,env,.venv,__pycache__,.git,migrations,migrates

      - name: Run tests
        env:
          # conftest sets these via setdefault; providing them here ensures
          # the CI environment doesn't inherit a stale DATABASE_URL.
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key"
          TMDB_API_KEY: "test"
          OPENAI_API_KEY: "test"
          CHROMA_API_KEY: "test"
          CHROMA_TENANT: "test"
          CHROMA_DATABASE: "test"
        run: pytest tests/ -v --tb=short
