name: CI

# Full verification gate. Every push to main/develop (and the active
# master-feature-roadmap feature branch) plus every PR to main runs the
# complete validation below. deploy.yml is coupled to THIS workflow's
# success on main via workflow_run — a red/cancelled run here can never
# reach production.

on:
  push:
    branches: [main, develop, master-feature-roadmap]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history: the whitespace/diff gate compares against the pushed
      # commit's parent (github.event.before), which does not exist in a
      # default depth-1 checkout (fatal: bad object <parent-sha>).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov flake8

      - name: Compile Python
        run: |
          # Byte-compiles every .py file in the repo; exits non-zero on
          # any syntax error. Compilation only — nothing is executed.
          python -m compileall -q .

      - name: Validate migrations
        run: |
          # Syntax-only (py_compile) — migrations are never EXECUTED in CI.
          files=(migrates/*.py)
          if [ -e "${files[0]}" ]; then
            python -m py_compile "${files[@]}"
            echo "Validated ${#files[@]} migration script(s)"
          else
            echo "No migration scripts found — nothing to validate"
          fi

      - name: Validate JavaScript
        run: |
          # Syntax check only (node --check) — browser code is never executed.
          find static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "All static/js files pass node --check"

      - name: Flake8 (errors-only baseline)
        run: |
          # Deliberate baseline limitation: the repo still carries
          # pre-existing style/complexity findings (e.g. C901/E712 in
          # auth.py/diary.py/analytics.py), so full-config flake8 is not
          # a CI gate yet. E9/F63/F7/F82 keep true syntax errors and
          # undefined names FATAL. --exit-zero is deliberately NOT used:
          # a real E9-class failure still fails this step.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,env,.venv,__pycache__,.git,migrations,migrates

      - name: Full test suite
        # Task F3: this job is OFFLINE — no TMDb key, no DNS, no internet.
        # TMDb payloads come from deterministic fixtures (tests/tmdb_offline.py)
        # and every other outbound connection fails loudly. Genuine external
        # integration tests are opt-in (`pytest -m tmdb`) and are deselected
        # by the `-m "not tmdb"` in pyproject's addopts, so this step needs no
        # credentials and its failures never depend on a third party.
        env:
          # conftest sets these via setdefault; providing them here ensures
          # the CI environment doesn't inherit a stale DATABASE_URL.
          # NOTE: conftest force-overrides DATABASE_URL to a throwaway
          # temp-file SQLite, so tests can never touch a real database.
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key"
          # A throwaway placeholder, NOT a secret. The suite is offline by
          # design (tests/tmdb_offline.py): TMDb payloads come from
          # deterministic fixtures and every other outbound connection
          # fails loudly. Real-TMDb integration tests are opt-in
          # (`pytest -m tmdb`) and are deselected here by the
          # `-m "not tmdb"` in pyproject's addopts.
          #
          # This value must stay identical to the one conftest defaults to and
          # the one tests/test_tmdb_offline.py asserts. Because this env var
          # is SET, it wins over conftest's setdefault, so any drift between
          # the three silently fails the placeholder contract test. The
          # canonical value is asserted by
          # tests/test_tmdb_offline.py::test_tmdb_key_is_a_throwaway_placeholder
          TMDB_API_KEY: "test-tmdb-key"
          OPENAI_API_KEY: "test"
        run: pytest tests/ -v --tb=short

      - name: Whitespace/conflict-marker gate over the code actually being tested
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # Handle the initial commit / missing before-SHA case.
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          # Make absolutely sure the base object exists in the runner.
          git cat-file -e "${BASE_SHA}^{commit}"

          echo "Checking changes: ${BASE_SHA}..${GITHUB_SHA}"
          git diff --check "${BASE_SHA}" "${GITHUB_SHA}" --

          # Scan ADDED lines for 7-char conflict-marker runs. The regex
          # is written as (<{7}|={7}|>{7}) so this workflow never contains
          # a literal marker sequence — the scanner must not match its own
          # detection logic in its own diff. The added-line anchor is
          # ^\+([^+].*)? : the [^+] head excludes '+++' diff metadata,
          # while the optional group keeps a marker starting immediately
          # after '+' detectable (a plain ^\+[^+].* would consume the
          # first marker char and only ever see 6 of the 7). '|| true'
          # handles grep's exit 1 (no match) under set -e/pipefail.
          DIFF="$(git diff --unified=0 "${BASE_SHA}" "${GITHUB_SHA}" -- \
            '*.py' '*.js' '*.html' '*.css' '*.yml' '*.yaml' '*.json' '*.md')"
          MARKERS="$(printf '%s\n' "${DIFF}" | grep -E '^\+([^+].*)?(<{7}|={7}|>{7})' || true)"
          if [[ -n "${MARKERS}" ]]; then
            echo "Conflict markers detected in added lines:"
            printf '%s\n' "${MARKERS}"
            exit 1
          fi
          echo "Whitespace/conflict-marker gate: clean"

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL migration verification (Decision D)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # The SQLite suite cannot prove two things that matter for a destructive
  # migration on production:
  #   * transactional DDL — pysqlite commits around DDL, so a failed migration
  #     can leave its DDL behind on SQLite but not on PostgreSQL;
  #   * advisory locks — pg_advisory_lock does not exist on SQLite, so the runner
  #     prints "lock: UNAVAILABLE" and no SQLite test can show that competing
  #     runners are actually excluded.
  #
  # These are executed here against a real server rather than asserted from
  # SQLite, mocks or reasoning. Pinned to postgres:17 to match production
  # (17.11) exactly.
  #
  # The database is a disposable container with a throwaway credential. The
  # tests additionally refuse to run at all if the URL is not local, so this
  # job cannot be pointed at production even by a mistaken variable.
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-scratch-password
          POSTGRES_DB: frameiq_migration_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The PG tests drop and recreate the public schema; a shallow or
          # wrong-ref checkout would run them against unintended code.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      - name: PostgreSQL version parity with production
        run: |
          set -euo pipefail
          psql "postgresql://postgres:${PGPASSWORD}@localhost:5432/frameiq_migration_scratch" \
            -c "SHOW server_version;"
          # Production reports 17.11. Fail if the service silently drifted to a
          # different major version, because the transactional-DDL and advisory
          # lock behaviour asserted here is version-sensitive in principle.
          MAJOR="$(psql "postgresql://postgres:${PGPASSWORD}@localhost:5432/frameiq_migration_scratch" \
            -tAc "SHOW server_version_num;" | cut -d. -f1)"
          if [ "${MAJOR}" -lt 17 ]; then
            echo "::error::PostgreSQL ${MAJOR} is older than production's 17."
            exit 1
          fi
        env:
          PGPASSWORD: ci-scratch-password

      - name: Migration tests against real PostgreSQL
        env:
          FRAMEIQ_TEST_POSTGRES_URL: postgresql://postgres:ci-scratch-password@localhost:5432/frameiq_migration_scratch
        run: pytest tests/test_migration_postgres.py -v --tb=short -m postgres
