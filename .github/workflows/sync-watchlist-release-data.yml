name: Sync Watchlist Release Data

on:
  schedule:
    - cron: '30 2 * * *'   # daily, after the TV episode sync (02:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_watchlist_release_data.py'
      - 'api/watchlist_release_sync.py'
      - 'models/movie_release.py'

permissions:
  contents: read
  issues: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            cd /home/deployer/FrameIQ
            docker compose exec -T web python scripts/sync_watchlist_release_data.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Watchlist Release Sync Failed',
              body: `Sync failed. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'bug']
            })
