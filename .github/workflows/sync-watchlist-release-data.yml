name: Sync Watchlist Release Data

on:
  schedule:
    - cron: '30 2 * * *'   # daily, after the TV episode sync (02:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_watchlist_release_data.py'
      - 'api/watchlist_release_sync.py'
      - 'models/movie_release.py'

permissions:
  contents: read
  issues: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            cd /home/deployer/FrameIQ
            # One-off container from the built web image — NOT 'exec' into
            # the running web service, which may predate the deploy that
            # added this script (the 'can't open file' incident). Runs
            # headless: shares compose config/env/network, needs no DB or
            # Valkey process (connects to db over the network), and the
            # gunicorn web service is never disturbed.
            docker compose run --rm --no-deps web \
              python scripts/sync_watchlist_release_data.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Watchlist Release Sync Failed',
              body: `Sync failed. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'bug']
            })
