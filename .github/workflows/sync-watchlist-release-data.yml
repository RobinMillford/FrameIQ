name: Sync Watchlist Release Data

on:
  schedule:
    - cron: '30 2 * * *'   # daily, after the TV episode sync (02:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_watchlist_release_data.py'
      - 'api/watchlist_release_sync.py'
      - 'models/movie_release.py'

permissions:
  contents: read
  issues: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    # Serialize with production deployment. The sync reads a schema that a
    # deploy may be transitioning, so the two must not overlap. `cancel` is
    # false: an interrupted sync is finished, not abandoned half-applied.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Preflight - confirm the deployed schema is ready
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/deployer/FrameIQ

            # Read-only readiness check, run from the SAME one-off image the
            # sync will use, so it validates the schema that image's models
            # require rather than some other build's expectations.
            #
            # `utils.schema_guard` is read-only and exempts itself from the
            # startup guard, so this neither writes nor bypasses anything. If
            # the schema is not ready the sync must NOT run: the sync script
            # imports `app`, whose startup guard would refuse anyway — this
            # step exists to turn that refusal into an actionable message
            # instead of an opaque traceback.
            echo "Checking schema readiness against the deployed image..."
            if ! docker compose run --rm --no-deps web \
                 python -m utils.schema_guard; then
              echo "::error::SCHEMA NOT READY - the watchlist release sync did NOT run."
              echo "::error::The deployed image requires schema that the database does not have."
              echo "::error::A deployment carrying the required migration has not completed successfully."
              echo "::error::Run the Deploy to VPS workflow and wait for it to succeed, then re-run this sync."
              exit 1
            fi
            echo "Schema is ready."

      - name: Run sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/deployer/FrameIQ
            # One-off container from the built web image — NOT 'exec' into
            # the running web service, which may predate the deploy that
            # added this script (the 'can't open file' incident). Runs
            # headless: shares compose config/env/network, needs no DB or
            # Valkey process (connects to db over the network), and the
            # gunicorn web service is never disturbed.
            docker compose run --rm --no-deps web \
              python scripts/sync_watchlist_release_data.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Watchlist Release Sync Failed',
              body: `Sync failed. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'bug']
            })
