name: Sync Upcoming TV Episodes

on:
  schedule:
    - cron: '0 2 * * *'   # daily 8:00 AM Bangladesh Time (UTC+6)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_upcoming_episodes.py'
      - 'models.py'
      - 'api/tmdb_client.py'

permissions:
  contents: read
  issues: write

jobs:
  sync-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deployer/FrameIQ
            docker compose exec -T web python scripts/sync_upcoming_episodes.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 TV Episode Sync Failed',
              body: `Sync failed. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'bug']
            })
