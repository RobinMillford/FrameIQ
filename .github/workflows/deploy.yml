# Production deployment — gated on green CI.
#
# This workflow NEVER runs because a push happened. It runs only after the
# "CI" workflow (ci-cd.yml) COMPLETES, and the job-level condition below
# enforces that the CI run was:
#   - workflow name = CI
#   - branch        = main        (PRs/develop/feature branches never deploy)
#   - conclusion    = success     (failure/cancelled/timed_out never deploy)
#
# The commit deployed is exactly github.event.workflow_run.head_sha — the
# SHA the CI run actually verified — not whatever happens to be origin/main
# HEAD at deploy time. The VPS resets to that SHA and re-verifies it.
#
# Structure deliberately mirrors the proven SSH patterns from
# sync-upcoming-episodes.yml / taste-profile-nightly.yml: script_stop
# (never swallow a failed command) + explicit command timeouts.
#
# Schema-changing deployments (Feature 10E order): build the verified-SHA
# image FIRST, run the named idempotent migration in a one-off container,
# and only then recreate web. Each schema-changing release adds its named
# migration line before the web recreate, in order — never a blind
# migrates/*.py sweep. Those scripts self-manage SKIP_SCHEMA_GUARD.

name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Serialize production deployments. Queued, never cancelled — a newer
  # commit waits for the in-flight deployment to finish.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The gate: every non-success CI conclusion (failure, cancelled,
    # timed_out, ...) and every non-main branch skips deployment entirely.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Capture CI-verified SHA
        id: sha
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "Deploying the exact commit CI verified: ${{ github.event.workflow_run.head_sha }}"

      # ── 1. Pre-flight: VPS tree must be clean before anything is reset ──
      - name: Pre-flight check (clean VPS working tree)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/deployer/FrameIQ
            git fetch origin main
            git checkout main -q
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::VPS working tree is dirty — refusing to reset (inspect manually)"
              git status --porcelain
              exit 1
            fi
            echo "VPS tree clean; origin/main fetched; ready to deploy"

      # ── 2. Deploy exactly the CI-verified SHA, build, recreate web ──────
      # Startup inside the container runs db.create_all() + the read-only
      # schema parity guard (utils/schema_guard.py): an incompatible schema
      # fails boot, which fails the container check below. SKIP_SCHEMA_GUARD
      # is never set for the running application.
      - name: Deploy and verify (exact SHA)
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERIFIED_SHA: ${{ steps.sha.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          envs: VERIFIED_SHA,SMOKE_TEST_USERNAME,SMOKE_TEST_PASSWORD
          script: |
            set -euo pipefail
            cd /home/deployer/FrameIQ

            # Exact-SHA deployment: never move past what CI actually tested.
            git checkout main -q
            git reset --hard "$VERIFIED_SHA"
            ACTUAL="$(git rev-parse HEAD)"
            if [ "$ACTUAL" != "$VERIFIED_SHA" ]; then
              echo "::error::VPS HEAD ($ACTUAL) != CI-verified SHA ($VERIFIED_SHA)"
              exit 1
            fi
            echo "VPS is at verified SHA: $ACTUAL"

            # ── Dependency health BEFORE anything is migrated/recreated ──
            DB_HEALTH="$(docker inspect -f '{{.State.Health.Status}}' frameiq-db-1)"
            VALKEY_HEALTH="$(docker inspect -f '{{.State.Health.Status}}' frameiq-valkey-1)"
            if [ "$DB_HEALTH" != "healthy" ] || [ "$VALKEY_HEALTH" != "healthy" ]; then
              echo "::error::db health='$DB_HEALTH' / valkey health='$VALKEY_HEALTH' — both must be healthy before a deploy"
              docker compose ps || true
              exit 1
            fi

            # ── Schema-changing deployments (Feature 10E order): build the
            # verified-SHA image FIRST (a migration script only exists in
            # the code being deployed — running it from the previous
            # deploy's image would fail on the first such deploy), then run
            # the named idempotent migration in a one-off container, and
            # only then recreate web. Named script only — never a blind
            # migrates/*.py sweep; future schema-changing releases add
            # their named migration line here, before the web recreate, in
            # order. SKIP_SCHEMA_GUARD=1 is the guard's documented operator
            # escape hatch for the one-off migration container; it is
            # NEVER set for the running application below.
            docker compose build web
            SKIP_SCHEMA_GUARD=1 docker compose run --rm --no-deps web python migrates/migrate_movie_release_dates.py

            # Recreate only the web service (rebuild is a cache hit).
            # Never 'down -v'; volumes (pgdata, chat_memory) are untouched.
            docker compose up -d --build web
            docker image prune -f

            # ── Container verification ─────────────────────────────────
            sleep 10
            docker compose ps
            STATE="$(docker inspect -f '{{.State.Status}}' frameiq-web-1)"
            if [ "$STATE" != "running" ]; then
              echo "::error::web container state is '$STATE' (expected running)"
              docker compose logs --tail=50 web || true
              exit 1
            fi

            # ── Application health (public URL, as a real client sees it) ──
            for i in 1 2 3 4 5; do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://frameiq.studio/health || true)"
              if [ "$CODE" = "200" ]; then
                echo "health: 200 OK"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::error::/health did not return 200 (last code: ${CODE:-none})"
                docker compose logs --tail=100 web || true
                exit 1
              fi
              echo "health attempt $i returned '${CODE:-none}' — retrying"
              sleep 6
            done

            # ── Smoke: route registration / non-5xx (unauthenticated) ──
            # Loopback origin bypasses any CDN/WAF layer so a bot-challenge
            # page can never be mistaken for an application failure.
            # /calendar 302s to login when unauthenticated — that is the
            # expected, correct behavior and passes.
            for path in /calendar /tv/upcoming; do
              CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
                --max-time 15 \
                "http://127.0.0.1:8002${path}" || true)"
              if [[ "$CODE" =~ ^2[0-9][0-9]$ || "$CODE" =~ ^3[0-9][0-9]$ ]]; then
                echo "smoke $path -> $CODE (OK)"
              else
                echo "::error::smoke $path -> ${CODE:-none} (5xx or unreachable)"
                docker compose logs --tail=100 web || true
                exit 1
              fi
            done

            # ── Authenticated /api/calendar smoke (Feature 10E) ──────────
            # Proves the unified calendar API's full envelope behind REAL
            # authentication. Uses the dedicated SMOKE_TEST_USERNAME /
            # SMOKE_TEST_PASSWORD GitHub secrets (a disposable production
            # test account — never a real user's credentials). If they are
            # not configured, this smoke is SKIPPED with the loud note
            # below: authentication is never weakened or bypassed to make
            # CI/CD pass. When configured, ANY failure here fails the
            # deployment.
            if [ -n "${SMOKE_TEST_USERNAME:-}" ] && [ -n "${SMOKE_TEST_PASSWORD:-}" ]; then
              CJ="$(mktemp)"
              API_RESP="$(mktemp)"
              trap 'rm -f "$CJ" "$API_RESP"' EXIT
              LOGIN_HTML="$(curl -sS --max-time 15 -c "$CJ" "http://127.0.0.1:8002/login" || true)"
              CSRF="$(printf '%s' "$LOGIN_HTML" | grep -o 'name="csrf_token" value="[^"]*"' | head -n1 | cut -d'"' -f4)"
              if [ -z "$CSRF" ]; then
                echo "::error::calendar API smoke: could not extract CSRF token from /login"
                exit 1
              fi
              LOGIN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
                -b "$CJ" -c "$CJ" \
                --data-urlencode "username=${SMOKE_TEST_USERNAME}" \
                --data-urlencode "password=${SMOKE_TEST_PASSWORD}" \
                --data-urlencode "csrf_token=${CSRF}" \
                "http://127.0.0.1:8002/login" || true)"
              if [ "$LOGIN_CODE" != "302" ]; then
                echo "::error::calendar API smoke: login failed (POST /login -> ${LOGIN_CODE:-none}, expected 302) — verify the SMOKE_TEST_* secrets and the smoke account"
                exit 1
              fi
              API_CODE="$(curl -sS -o "$API_RESP" -w '%{http_code}' --max-time 15 \
                -b "$CJ" "http://127.0.0.1:8002/api/calendar" || true)"
              if [ "$API_CODE" != "200" ]; then
                echo "::error::/api/calendar -> ${API_CODE:-none} (expected 200)"
                docker compose logs --tail=100 web || true
                exit 1
              fi
              # Envelope validation runs inside the web container (python is
              # guaranteed there). Only aggregate counts are printed — no
              # private event data and no credentials ever reach the logs.
              if cat "$API_RESP" | docker compose exec -T web python -c "import json,sys; d=json.load(sys.stdin); meta=d.get('meta') or {}; counts=meta.get('counts') or {}; missing={'tv','movie','total'}-set(counts); assert isinstance(d.get('events'), list) and meta.get('today') and not missing, 'invalid calendar envelope'; print('calendar API envelope OK: tv=%s movie=%s total=%s' % (counts.get('tv'), counts.get('movie'), counts.get('total')))"; then
                echo "calendar API smoke: envelope valid"
              else
                echo "::error::/api/calendar returned an invalid calendar envelope"
                docker compose logs --tail=100 web || true
                exit 1
              fi
            else
              echo "NOTE: SMOKE_TEST_USERNAME / SMOKE_TEST_PASSWORD are not configured — the authenticated /api/calendar smoke was SKIPPED (documented limitation; authentication is never disabled for smoke testing). Public /calendar and /tv/upcoming smokes still ran."
            fi

            # ── Startup / log failure scan (targeted, not a blanket grep) ──
            sleep 5
            docker compose logs --since=3m --tail=200 web || true
            LOGS="$(docker compose logs --since=3m --tail=200 web 2>/dev/null || true)"
            if printf '%s' "$LOGS" | grep -E 'SchemaMismatchError|Worker failed to boot|AssertionError|CRITICAL|Exception in worker process'; then
              echo "::error::startup/application failure pattern detected in web logs"
              exit 1
            fi
            echo "Log scan clean (rate-limit 429 bot traffic is not a failure)."

            echo "DEPLOY SUCCESS: $ACTUAL is live and verified healthy."
