# Production deployment — gated on green CI.
#
# This workflow NEVER runs because a push happened. It runs only after the
# "CI" workflow (ci-cd.yml) COMPLETES, and the job-level condition below
# enforces that the CI run was:
#   - workflow name = CI
#   - branch        = main        (PRs/develop/feature branches never deploy)
#   - conclusion    = success     (failure/cancelled/timed_out never deploy)
#
# The commit deployed is exactly github.event.workflow_run.head_sha — the
# SHA the CI run actually verified — not whatever happens to be origin/main
# HEAD at deploy time. The VPS resets to that SHA and re-verifies it.
#
# Structure deliberately mirrors the proven SSH patterns from
# sync-upcoming-episodes.yml / taste-profile-nightly.yml: script_stop
# (never swallow a failed command) + explicit command timeouts.
#
# Schema-changing deployments run through ONE authoritative command,
# `scripts/migrate.py upgrade`, which applies every registered migration in
# order inside a transaction per migration and records each in a checksummed
# ledger. A release no longer adds its own named script line here; it adds an
# entry to migrates/registry.py and the deploy picks it up automatically.
# Ordering is no longer something a human maintains by editing this file.
#
# Since Task F7 release hardening the web process itself performs NO DDL:
# app.py no longer calls db.create_all() at startup. The schema is owned by
# these migrations alone, and the read-only guard refuses to boot the
# application against a database they have not prepared.

name: Deploy to VPS

on:
  # Automatic path. Runs the SAFE deploy only: convergence, schema guard,
  # baseline adoption, non-destructive migrations, and the web recreate.
  # Destructive migrations are never reached from here.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Operator-initiated path. This is the ONLY way the destructive legacy-wishlist
  # migration can be reached, and it additionally requires the
  # `production-destructive` environment, which must be configured with required
  # reviewers in repository settings. The backup reference is a per-run input,
  # so it cannot be a stale repository variable carried over from a previous
  # deployment.
  workflow_dispatch:
    inputs:
      destructive_migration:
        description: "Exact migration id to authorize. Must match the migration's own id."
        required: true
        default: "0002_remove_legacy_wishlist"
      backup_ref:
        description: "Reference to the snapshot that was actually created, e.g. neon-snapshot-20260928-ab12cd. Placeholders are rejected."
        required: true
      backup_verified_by:
        description: "Operator who confirmed the snapshot was restored successfully."
        required: true
      ref:
        description: "Commit SHA whose CI run succeeded (must be a full 40-char SHA)."
        required: true

permissions:
  contents: read

concurrency:
  # Serialize production deployments. Queued, never cancelled — a newer
  # commit waits for the in-flight deployment to finish.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The gate: every non-success CI conclusion (failure, cancelled,
    # timed_out, ...) and every non-main branch skips deployment entirely.
    #
    # `event_name` is checked explicitly, not left to a null comparison. This
    # workflow also accepts `workflow_dispatch` (that path exists only to
    # authorise the destructive step), and relying on a missing field to make
    # the condition false would be an accident rather than a control.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Capture CI-verified SHA
        id: sha
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "Deploying the exact commit CI verified: ${{ github.event.workflow_run.head_sha }}"

      # ── 1. Pre-flight: VPS tree must be clean before anything is reset ──
      - name: Pre-flight check (clean VPS working tree)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/deployer/FrameIQ
            git fetch origin main
            git checkout main -q
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::VPS working tree is dirty — refusing to reset (inspect manually)"
              git status --porcelain
              exit 1
            fi
            echo "VPS tree clean; origin/main fetched; ready to deploy"

      # ── 2. Deploy exactly the CI-verified SHA, build, recreate web ──────
      # Startup inside the container runs db.create_all() + the read-only
      # schema parity guard (utils/schema_guard.py): an incompatible schema
      # fails boot, which fails the container check below. SKIP_SCHEMA_GUARD
      # is never set for the running application.
      - name: Deploy and verify (exact SHA)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          VERIFIED_SHA: ${{ steps.sha.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          envs: VERIFIED_SHA,SMOKE_TEST_USERNAME,SMOKE_TEST_PASSWORD
          script: |
            set -euo pipefail
            cd /home/deployer/FrameIQ

            # Exact-SHA deployment: never move past what CI actually tested.
            git checkout main -q
            git reset --hard "$VERIFIED_SHA"
            ACTUAL="$(git rev-parse HEAD)"
            if [ "$ACTUAL" != "$VERIFIED_SHA" ]; then
              echo "::error::VPS HEAD ($ACTUAL) != CI-verified SHA ($VERIFIED_SHA)"
              exit 1
            fi
            echo "VPS is at verified SHA: $ACTUAL"

            # ── Dependency health BEFORE anything is migrated/recreated ──
            DB_HEALTH="$(docker inspect -f '{{.State.Health.Status}}' frameiq-db-1)"
            VALKEY_HEALTH="$(docker inspect -f '{{.State.Health.Status}}' frameiq-valkey-1)"
            if [ "$DB_HEALTH" != "healthy" ] || [ "$VALKEY_HEALTH" != "healthy" ]; then
              echo "::error::db health='$DB_HEALTH' / valkey health='$VALKEY_HEALTH' — both must be healthy before a deploy"
              docker compose ps || true
              exit 1
            fi

            # ── Schema-changing deployments (Task F8: one authoritative
            # path) ──────────────────────────────────────────────────────
            # Build the verified-SHA image FIRST: a migration only exists in
            # the code being deployed, so running one from the previous
            # deploy's image would fail on the first such deploy.
            #
            # The sequence below replaces the older "add a named script line
            # per release" habit, which had drifted to three scripts and had
            # already lost track of at least nine. There is now one command
            # that applies everything registered, in order, transactionally,
            # with checksums — `scripts/migrate.py upgrade`.
            #
            #   1. convergence  — one-time, additive creation of the 11 tables
            #      that were declared but missing. Historical, not versioned.
            #   2. guard        — prove that the ONLY drift is objects a registered,
            #      pending, non-destructive migration owns. Strict about
            #      everything else. Needed because a release adding a model
            #      necessarily deploys models ahead of their migration.
            #   3. baseline     — record ONCE that the verified pre-existing
            #      state was adopted. Idempotent: a no-op afterwards. This is
            #      what separates "history known from here on" from "history
            #      unknown", and it must never run automatically.
            #   4. upgrade      — apply every registered pending migration.
            #   5. guard        — STRICT: prove it converged, before web is
            #      recreated. No tolerance at all on this one.
            #
            # A non-zero exit at any step fails the deploy BEFORE web is
            # recreated. An unprepared schema must not be served. The tolerant
            # check at step 2 exists only to let step 4 run; step 5 is what
            # actually gates serving.
            #
            # `--allow-production` is the runner's deliberate operator opt-in
            # for a remote target. There is no environment variable that
            # enables it: a deploy cannot widen its own authority by accident.
            docker compose build web

            # 1. Ledger bootstrap: create ONLY the `schema_migrations` table if
            #    it is absent. Idempotent: if it already exists with the
            #    declared schema this is a no-op, and if it exists with an
            #    incompatible schema it refuses rather than repairing.
            #
            #    This MUST come before convergence. Convergence refuses on any
            #    missing table outside its historical allow-list, and
            #    `schema_migrations` is new infrastructure rather than one of
            #    the eleven legacy gaps — so without this step the first deploy
            #    after the F8 rollout refused and created nothing, leaving the
            #    declared-but-missing application tables (including
            #    `import_source_mapping`) absent as well.
            #
            #    The allow-list was deliberately NOT widened to include the
            #    ledger: that would let unreviewed tables be created by a
            #    historical repair script.
            SKIP_SCHEMA_GUARD=1 docker compose run --rm --no-deps web \
              python scripts/migrate.py init-ledger --allow-production

            # 2. Legacy convergence: additive only, idempotent, bounded to an
            #    explicit 11-table allow-list, fail-closed on anything else.
            #
            #    `--allow-production` is required for the same reason as every
            #    runner line above: the script authorizes its target through
            #    utils.db_target before it imports `app`, and refuses a remote
            #    database without that explicit flag. It is passed to the
            #    script, not exported as an environment variable, so this step
            #    cannot widen its own authority.
            SKIP_SCHEMA_GUARD=1 docker compose run --rm --no-deps web \
              python migrates/migrate_schema_convergence.py --allow-production

            # 3. Prove that the ONLY schema drift is objects a registered,
            #    pending, non-destructive migration declares it owns.
            #
            #    This step must be tolerant and the next-but-one strict. A
            #    release that adds a model (F9 added person, media_cast,
            #    media_item.cast_enriched_at, taste_profile.actor_affinity_json)
            #    necessarily deploys models that reference schema the database
            #    does not have yet — the runner creates it at step 5. A strict
            #    guard here therefore aborted the deploy before the migration
            #    could run, which is exactly the failure `init-ledger` was
            #    introduced to prevent for the ledger itself.
            #
            #    `--allow-pending-migrations` narrows this to objects a
            #    migration OWNS, which is declared by the migration
            #    (CREATES_TABLES / ADDS_COLUMNS) and proven by
            #    utils.schema_guard.pending_migration_objects(). It stays fatal
            #    for: anything not registered, anything owned by a DESTRUCTIVE
            #    migration (so 0002 never excuses a missing table), and
            #    anything whose migration is ALREADY APPLIED — there, a missing
            #    object is genuine drift, not a pending one.
            #
            #    This is a read-only CLI check. The application startup guard is
            #    never tolerant, and step 6 re-runs the STRICT form below, so
            #    the app cannot start on an incomplete schema.
            docker compose run --rm --no-deps web \
              python -m utils.schema_guard --allow-pending-migrations

            # 4. Adopt the verified legacy state exactly once. Exits 0 and does
            #    nothing on every subsequent deploy. It records that the schema
            #    was VERIFIED — not that each historical script ran, which
            #    nobody recorded and which must not be invented.
            SKIP_SCHEMA_GUARD=1 docker compose run --rm --no-deps web \
              python scripts/migrate.py adopt-legacy-baseline --allow-production

            # 5. Apply every registered pending migration, in order.
            #    Refuses to start if an already-applied migration's file has
            #    changed, or if any migration's verify() does not converge.
            SKIP_SCHEMA_GUARD=1 docker compose run --rm --no-deps web \
              python scripts/migrate.py upgrade --allow-production

            # 6. Prove convergence before web is recreated, so a migration gap
            #    fails here rather than as a dead worker later.
            docker compose run --rm --no-deps web python -m utils.schema_guard

            # 7. Report the resulting history. Read-only; prints what is applied,
            # what is pending, and any checksum mismatch.
            SKIP_SCHEMA_GUARD=1 docker compose run --rm --no-deps web \
              python scripts/migrate.py status --allow-production

            # Recreate only the web service (rebuild is a cache hit).
            # Never 'down -v'; volumes (pgdata, chat_memory) are untouched.
            docker compose up -d --build web
            docker image prune -f

            # ── Container verification ─────────────────────────────────
            sleep 10
            docker compose ps
            STATE="$(docker inspect -f '{{.State.Status}}' frameiq-web-1)"
            if [ "$STATE" != "running" ]; then
              echo "::error::web container state is '$STATE' (expected running)"
              docker compose logs --tail=50 web || true
              exit 1
            fi

            # ── Application health (public URL, as a real client sees it) ──
            for i in 1 2 3 4 5; do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://frameiq.studio/health || true)"
              if [ "$CODE" = "200" ]; then
                echo "health: 200 OK"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::error::/health did not return 200 (last code: ${CODE:-none})"
                docker compose logs --tail=100 web || true
                exit 1
              fi
              echo "health attempt $i returned '${CODE:-none}' — retrying"
              sleep 6
            done

            # ── Smoke: route registration / non-5xx (unauthenticated) ──
            # Loopback origin bypasses any CDN/WAF layer so a bot-challenge
            # page can never be mistaken for an application failure.
            # /calendar 302s to login when unauthenticated — that is the
            # expected, correct behavior and passes.
            for path in /calendar /tv/upcoming; do
              CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
                --max-time 15 \
                "http://127.0.0.1:8002${path}" || true)"
              # NO bare 'else' lines in this script: the drone-ssh layer
              # behind appleboy/ssh-action (script_stop: true) splits the
              # script into physical lines and appends an exit-code check
              # after EVERY line not ending in backslash — including bare
              # 'else' lines, which then execute that check with the FAILED
              # condition's $? as the else branch's first statement, i.e. a
              # silent instant 'exit 1' before any diagnostic (the
              # 2026-09-20 deploy failures). Guarded ifs keep the exact
              # same strictness with none of the hazard.
              if [[ "$CODE" =~ ^2[0-9][0-9]$ || "$CODE" =~ ^3[0-9][0-9]$ ]]; then
                echo "smoke $path -> $CODE (OK)"
              fi
              if [[ ! "$CODE" =~ ^2[0-9][0-9]$ && ! "$CODE" =~ ^3[0-9][0-9]$ ]]; then
                echo "::error::smoke $path -> ${CODE:-none} (5xx or unreachable)"
                docker compose logs --tail=100 web || true
                exit 1
              fi
            done

            # ── Authenticated /api/calendar smoke (Feature 10E) ──────────
            # Proves the unified calendar API's full envelope behind REAL
            # authentication. Uses the dedicated SMOKE_TEST_USERNAME /
            # SMOKE_TEST_PASSWORD GitHub secrets (a disposable production
            # test account — never a real user's credentials). If they are
            # not configured, this smoke is SKIPPED with the loud note
            # below: authentication is never weakened or bypassed to make
            # CI/CD pass. When configured, ANY failure here fails the
            # deployment.
            if [ -n "${SMOKE_TEST_USERNAME:-}" ] && [ -n "${SMOKE_TEST_PASSWORD:-}" ]; then
              CJ="$(mktemp)"
              API_RESP="$(mktemp)"
              LOGIN_PAGE="$(mktemp)"
              trap 'rm -f "$CJ" "$API_RESP" "$LOGIN_PAGE"' EXIT
              # NOTE: the CSRF pipeline MUST tolerate grep finding no match
              # — under 'set -euo pipefail' a bare pipeline failure here
              # exits the whole deployment SILENTLY, before the diagnostic
              # below can run (the 2026-09-20 deploy failure). '|| true'
              # lets the explicit empty-CSRF check produce a real error.
              # Bounded retry: a transient rate-limit/error page on the
              # login GET must not fail an otherwise-healthy deploy.
              CSRF=""
              for i in 1 2 3; do
                LOGIN_CODE_GET="$(curl -sS -o "$LOGIN_PAGE" -w '%{http_code}' --max-time 15 -c "$CJ" "http://127.0.0.1:8002/login" || true)"
                LOGIN_HTML="$(cat "$LOGIN_PAGE" 2>/dev/null || true)"
                CSRF="$(printf '%s' "$LOGIN_HTML" | grep -o 'name="csrf_token" value="[^"]*"' | head -n1 | cut -d'"' -f4 || true)"
                if [ -n "$CSRF" ]; then
                  break
                fi
                if [ "$i" = "3" ]; then
                  echo "::error::calendar API smoke: could not extract CSRF token from /login after 3 attempts (GET /login -> ${LOGIN_CODE_GET:-none}, body length: ${#LOGIN_HTML})"
                  docker compose logs --tail=50 web || true
                  exit 1
                fi
                echo "CSRF extraction attempt $i failed (GET /login -> ${LOGIN_CODE_GET:-none}, body length: ${#LOGIN_HTML}) — retrying"
                sleep 5
              done
              echo "calendar API smoke: login page fetched (HTTP ${LOGIN_CODE_GET:-unknown})"
              echo "calendar API smoke: csrf token found"
              LOGIN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
                -b "$CJ" -c "$CJ" \
                --data-urlencode "username=${SMOKE_TEST_USERNAME}" \
                --data-urlencode "password=${SMOKE_TEST_PASSWORD}" \
                --data-urlencode "csrf_token=${CSRF}" \
                "http://127.0.0.1:8002/login" || true)"
              if [ "$LOGIN_CODE" != "302" ]; then
                echo "::error::calendar API smoke: login failed (POST /login -> ${LOGIN_CODE:-none}, expected 302) — verify the SMOKE_TEST_* secrets and the smoke account"
                exit 1
              fi
              echo "calendar API smoke: login POST -> 302"
              API_CODE="$(curl -sS -o "$API_RESP" -w '%{http_code}' --max-time 15 \
                -b "$CJ" "http://127.0.0.1:8002/api/calendar" || true)"
              if [ "$API_CODE" != "200" ]; then
                echo "::error::/api/calendar -> ${API_CODE:-none} (expected 200)"
                docker compose logs --tail=100 web || true
                exit 1
              fi
              echo "calendar API smoke: authenticated API -> 200"
              # Envelope validation runs inside the web container (python is
              # guaranteed there). Only aggregate counts are printed — no
              # private event data and no credentials ever reach the logs.
              # Guarded envelope check (no bare 'else'): non-empty output
              # == the OK line from the assertion script; empty output
              # (assertion failed, stderr dropped) == invalid envelope and
              # a hard deployment failure. Only aggregate counts are
              # printed — no private event data ever reaches the logs.
              ENVELOPE_OK="$(cat "$API_RESP" | docker compose exec -T web python -c "import json,sys; d=json.load(sys.stdin); meta=d.get('meta') or {}; counts=meta.get('counts') or {}; missing={'tv','movie','total'}-set(counts); assert isinstance(d.get('events'), list) and isinstance(meta, dict) and meta.get('today') and not missing, 'invalid calendar envelope'; print('calendar API envelope OK: tv=%s movie=%s total=%s' % (counts.get('tv'), counts.get('movie'), counts.get('total')))" 2>/dev/null || true)"
              if [ -n "$ENVELOPE_OK" ]; then
                echo "calendar API smoke: envelope valid"
                echo "$ENVELOPE_OK"
              fi
              if [ -z "$ENVELOPE_OK" ]; then
                echo "::error::/api/calendar returned an invalid calendar envelope"
                docker compose logs --tail=100 web || true
                exit 1
              fi
            fi
            # Skip note as a guarded block (no bare 'else' — see the
            # drone-ssh script_stop comment above).
            if [ -z "${SMOKE_TEST_USERNAME:-}" ] || [ -z "${SMOKE_TEST_PASSWORD:-}" ]; then
              echo "NOTE: SMOKE_TEST_USERNAME / SMOKE_TEST_PASSWORD are not configured — the authenticated /api/calendar smoke was SKIPPED (documented limitation; authentication is never disabled for smoke testing). Public /calendar and /tv/upcoming smokes still ran."
            fi

            # ── Startup / log failure scan (targeted, not a blanket grep) ──
            sleep 5
            docker compose logs --since=3m --tail=200 web || true
            LOGS="$(docker compose logs --since=3m --tail=200 web 2>/dev/null || true)"
            if printf '%s' "$LOGS" | grep -E 'SchemaMismatchError|Worker failed to boot|AssertionError|CRITICAL|Exception in worker process'; then
              echo "::error::startup/application failure pattern detected in web logs"
              exit 1
            fi
            echo "Log scan clean (rate-limit 429 bot traffic is not a failure)."

            echo "DEPLOY SUCCESS: $ACTUAL is live and verified healthy."

  # ─────────────────────────────────────────────────────────────────────────
  # Destructive migration step — separately approved, never automatic.
  # ─────────────────────────────────────────────────────────────────────────
  #
  # This job exists so that reaching the DROP TABLE requires three independent
  # things, none of which a routine CI-green deploy supplies:
  #
  #   1. a deliberate `workflow_dispatch` with a per-run backup reference and a
  #      named operator (inputs, not repository variables — a stale variable is
  #      not evidence that today's snapshot exists);
  #   2. approval of the `production-destructive` environment, which MUST be fully
  #      protected in repository settings. All THREE protections are required:
  #        - at least one entry under 'Required reviewers';
  #        - 'Prevent self-review' ENABLED, so whoever dispatched the run cannot
  #          be the one who approves it;
  #        - 'Allow administrators to bypass configured protection rules'
  #          DESELECTED, so a repository admin cannot skip the review.
  #      Reviewers alone are not enough: without 'Prevent self-review' the
  #      dispatcher can approve their own run, and with administrator bypass
  #      permitted the whole rule set can be overridden. The preflight step
  #      below reads the environment and fails closed unless all three hold.
  #
  #      Creating the environment configures none of this. GitHub creates
  #      `production-destructive` automatically, with no protection rules, the
  #      first time any workflow references it, so the first dispatch is
  #      expected to stop and ask for this configuration;
  #   3. the runner's own per-migration authorization check, which re-verifies
  #      the backup reference and refuses on placeholders.
  #
  # It does NOT depend on the `deploy` job: that job is skipped on a dispatch,
  # so depending on it would skip this one too.
  destructive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialised against the automatic deploy, so an approval cannot race a
    # deploy that is already migrating.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch'
    # This environment MUST be fully protected in repository settings
    # (Settings > Environments): at least one entry under 'Required reviewers',
    # 'Prevent self-review' ENABLED, and 'Allow administrators to bypass
    # configured protection rules' DESELECTED. Creating the environment alone
    # configures none of them — the preflight step below fails closed until all
    # three are in place.
    environment:
      name: production-destructive
      url: https://frameiq.studio/health
    steps:
      - name: Reject unusable dispatch input
        run: |
          set -euo pipefail
          # A full SHA is required so the migration code that runs is pinned to
          # a specific reviewed commit rather than a moving branch.
          if [[ ! "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::inputs.ref must be a full 40-character commit SHA (got '${REF_LEN:-$(echo -n "${{ inputs.ref }}" | wc -c)}' characters). A branch name is not acceptable for a destructive step."
            exit 1
          fi
          # The authorization must name a migration that actually exists and
          # actually declares itself destructive. Anything else is refused here
          # rather than being passed to the runner.
          case "${{ inputs.destructive_migration }}" in
            0002_remove_legacy_wishlist) ;;
            *) echo "::error::inputs.destructive_migration must be 0002_remove_legacy_wishlist, got '${{ inputs.destructive_migration }}'."
               exit 1 ;;
          esac
          # Reject obvious placeholders BEFORE any remote contact.
          for value in "${{ inputs.backup_ref }}" "${{ inputs.backup_verified_by }}"; do
            case "$(echo "$value" | tr '[:upper:]' '[:lower:]')" in
              yes|y|true|1|ok|none|null|"n/a"|na|todo|tbd|changeme|placeholder|dummy|example|sample|backup|snap|snapshot|-)
                echo "::error::A placeholder was supplied as backup evidence. A real snapshot reference and a real operator are required."
                exit 1 ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::Empty backup evidence supplied."
              exit 1
            fi
          done
          if [ "${#{{ inputs.backup_ref }}}" ] -lt 8 ]; then
            echo "::error::inputs.backup_ref is too short to identify a snapshot."
            exit 1
          fi

      - name: Fail closed unless the environment really has required reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A GitHub Environment with NO required reviewers protects nothing:
          # anyone able to dispatch can then approve it. That would make this
          # job self-authorising while appearing to be gated, so verify the
          # protection rule actually exists and lists reviewers.
          #
          # This is checked rather than assumed. Declaring `environment:` in the
          # job is necessary but not sufficient evidence of a human gate.
          ENV_NAME="production-destructive"

          # Every refusal ends here, so the operator is told both that nothing
          # destructive ran and exactly what to configure. Creating the
          # environment is deliberately called out as insufficient on its own.
          refuse() {
            echo "::error::Destructive migration STOPPED SAFELY — no production change was made."
            echo "::error::Reason: ${1}"
            echo "::error::To fix, open repository settings (Settings > Environments > ${ENV_NAME}):"
            echo "::error::   1. The '${ENV_NAME}' environment must exist."
            echo "::error::   2. It must have a 'Required reviewers' protection rule."
            echo "::error::   3. That rule must list at least one reviewer (a user or a team)."
            echo "::error::   4. That rule must have 'Prevent self-review' ENABLED, so whoever"
            echo "::error::      dispatched this run cannot be the one who approves it."
            echo "::error::   5. 'Allow administrators to bypass configured protection rules' must be"
            echo "::error::      DESELECTED, so a repository admin cannot skip the review entirely."
            echo "::error::Creating the environment alone is NOT sufficient: an environment with no"
            echo "::error::required reviewers, with reviewers but no independent-approval rule, or"
            echo "::error::with administrator bypass still enabled, applies no protection against a"
            echo "::error::destructive migration that nobody independent had to agree to."
            exit 1
          }

          RESPONSE="$(mktemp)"
          trap 'rm -f "${RESPONSE}"' EXIT

          # `if !` rather than a bare command: errexit does not apply inside a
          # condition, so the failure is caught here and turned into advice
          # instead of an opaque gh error. A missing environment is a 404 and an
          # unreadable one is a 403; both must refuse, never pass.
          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${ENV_NAME}" > "${RESPONSE}"; then
            refuse "the environments API request failed — '${ENV_NAME}' does not exist, or the workflow token could not read it."
          fi
          echo "Environment response: $(wc -c < "${RESPONSE}" | tr -d ' ') bytes."

          # F25: the documented response exposes protection rules as an ARRAY:
          #   protection_rules: [ { type: "required_reviewers",
          #                            prevent_self_review: <bool>,
          #                            reviewers: [ {type, reviewer}, ... ] }, ... ]
          # The old filter read `.deployment_protection_rule.required_reviewers`, a
          # single-object shape the API no longer returns, so the `// []` fallback
          # silently produced zero on every run and this gate could never pass.
          #
          # Only a `required_reviewers` rule counts. A wait timer or a deployment
          # branch policy is not a human gate and must not be mistaken for one,
          # and a missing property is never treated as proof of configuration.
          #
          # The heredoc body below is written at this block's indentation on
          # purpose: the YAML block scalar dedents the whole run block uniformly,
          # so these lines land at column 0 where Python requires top-level
          # statements. Re-indent the run block as a unit, never these alone.
          # Two facts come back on one line: "<reviewer count> <self-review enabled?>".
          FACTS="$(
            REVIEWER_RESPONSE="${RESPONSE}" python3 - <<'PYTHON'
          import json
          import os
          import sys

          RESPONSE = os.environ["REVIEWER_RESPONSE"]

          # Distinguishes "key absent" from "key present and null". Both are
          # rejected below, but only the distinct report makes the two
          # misconfigurations diagnosable from the CI log.
          _MISSING = object()

          def refuse(reason):
              sys.stderr.write(f"::error::{reason}\n")
              sys.exit(1)

          try:
              with open(RESPONSE, encoding="utf-8") as handle:
                  environment = json.load(handle)
          except Exception as exc:
              refuse(f"the environments API response was not readable JSON ({exc}). "
                     f"An unreadable response is not evidence of a reviewer gate.")
              raise AssertionError("unreachable")  # keeps the failure explicit

          if not isinstance(environment, dict):
              refuse("the environments API response was not a JSON object.")

          rules = environment.get("protection_rules")
          if rules is None:
              refuse(f"the response has no 'protection_rules' property, so no reviewer "
                     f"gate can be confirmed. (An older single-object "
                     f"'deployment_protection_rule' shape is no longer returned "
                     f"and is deliberately NOT treated as configured.)")
          if not isinstance(rules, list):
              refuse(f"'protection_rules' was {type(rules).__name__}, expected a list.")

          reviewers_found = 0
          present_types = []
          self_review_raw = _MISSING
          self_review_seen = False
          for rule in rules:
              if not isinstance(rule, dict):
                  refuse("a protection rule was not a JSON object; refusing.")
              rule_type = rule.get("type")
              present_types.append(str(rule_type))
              # Wait timers and deployment branch policies are not human gates,
              # and must not be mistaken for one even if a future API revision
              # attaches a reviewers array to them.
              if rule_type != "required_reviewers":
                  continue
              if self_review_seen:
                  # GitHub returns one rule per type, so a second
                  # required_reviewers entry is a structure this gate cannot
                  # reason about. Refuse rather than guess which one the UI
                  # would actually enforce.
                  refuse("the response contains more than one "
                         "'required_reviewers' rule; refusing to guess which "
                         "one applies.")
              self_review_raw = rule.get("prevent_self_review", _MISSING)
              self_review_seen = True
              reviewers = rule.get("reviewers")
              if reviewers is None:
                  continue  # rule present but unconfigured -> contributes zero
              if not isinstance(reviewers, list):
                  refuse(f"'reviewers' on the required_reviewers rule was "
                         f"{type(reviewers).__name__}, expected a list.")
              # F30: the LENGTH of this array is not evidence that approvable
              # reviewers exist. Every entry must match the documented response
              # shape:
              #   { "type": "User" | "Team", "reviewer": { "id": <int>, ... } }
              # where the identity is `login` for a user and `slug` for a team,
              # per GitHub's `simple-user` and `team` response schemas, which
              # the OpenAPI description composes as
              # deployment-reviewer-type + anyOf[simple-user, team].
              #
              # The WHOLE list is refused if any entry is malformed, rather than
              # counting the survivors. Counting survivors is how a response
              # like ["x", null, {}] would otherwise report a reviewer gate that
              # nobody can actually satisfy.
              for position, entry in enumerate(reviewers):
                  if not isinstance(entry, dict):
                      refuse(f"reviewer entry {position} was "
                             f"{type(entry).__name__}, expected an object.")
                  entry_type = entry.get("type")
                  if entry_type not in ("User", "Team"):
                      refuse(f"reviewer entry {position} declared type "
                             f"{entry_type!r}; the documented values are "
                             f"'User' and 'Team'.")
                  identity = entry.get("reviewer")
                  if not isinstance(identity, dict):
                      refuse(f"reviewer entry {position} ({entry_type}) has no "
                             f"'reviewer' object (got {type(identity).__name__}).")
                  identity_id = identity.get("id")
                  # bool is a subclass of int in Python, so a JSON `true`
                  # would otherwise pass as an identity.
                  if isinstance(identity_id, bool) or not isinstance(identity_id, int):
                      refuse(f"reviewer entry {position} ({entry_type}) has no "
                             f"integer 'id' (got {identity_id!r}).")
                  identity_field = "login" if entry_type == "User" else "slug"
                  handle = identity.get(identity_field)
                  if not isinstance(handle, str) or not handle:
                      refuse(f"reviewer entry {position} ({entry_type}) has no "
                             f"non-empty {identity_field!r}.")
              reviewers_found += len(reviewers)

          # F26: a non-empty reviewer list is NOT independent approval. The
          # person who dispatched the run could otherwise sit on that list and
          # approve their own destructive migration. GitHub models independence
          # as `prevent_self_review` on the rule, and it must be the JSON
          # boolean true.
          #
          # `is True` is deliberate identity against the True singleton, not
          # equality and not truthiness. In Python `True == 1` and
          # `False == 0`, so an equality test would accept the number 1, and a
          # truthiness test would additionally accept null, 0 and the string
          # "true". None of those mean "enabled" in this API, so all are
          # rejected here.
          self_review_enabled = self_review_seen and self_review_raw is True
          self_review_shown = ("<absent>" if self_review_raw is _MISSING
                               else repr(self_review_raw))

          # F27: administrator bypass. GitHub's reference documentation is
          # explicit that "By default, administrators can bypass the protection
          # rules and force deployments to specific environments", and that the
          # hardened state is configured by de-selecting "Allow administrators
          # to bypass configured protection rules". So `true` is the unsafe
          # default and `false` is the state this gate demands.
          #
          # `is False` is identity against the False singleton for the same
          # reason as `is True` above: in Python `0 == False` and
          # `"" == False` is false but `bool("false")` is True, so neither an
          # equality test nor a truthiness test distinguishes the JSON boolean
          # false from the number 0 or the string "false". Absent is rejected
          # outright, because a field GitHub stopped sending is not evidence
          # that bypass is disabled.
          #
          # Note: `can_admins_bypass` is NOT declared in GitHub's published
          # `environment` OpenAPI schema, so this relies on a field the REST
          # schema omits. It was observed as a JSON boolean in 31/31 live
          # environment responses across 16 repositories, with both values
          # present. If it were ever withdrawn the gate would refuse, which is
          # the safe direction, but the destructive path would need updating.
          admins_raw = environment.get("can_admins_bypass", _MISSING)
          admins_bypass_disabled = admins_raw is False
          admins_shown = ("<absent>" if admins_raw is _MISSING
                          else repr(admins_raw))

          # Transported as pipe-delimited fields, so an embedded space or pipe
          # would shift the fields after it. These two are diagnostic only -- the
          # accept/reject decisions use the dedicated booleans ahead of them.
          def wire(value):
              return value.replace(" ", "_").replace("|", "/")

          sys.stderr.write(f"Protection rule types present: {present_types or ['<none>']}\n")
          sys.stderr.write(f"Configured required reviewers: {reviewers_found}\n")
          sys.stderr.write(
              f"prevent_self_review: {self_review_shown} "
              f"(independent approval: {'yes' if self_review_enabled else 'NO'})\n")
          sys.stderr.write(
              f"can_admins_bypass: {admins_shown} "
              f"(administrator bypass: {'DISABLED' if admins_bypass_disabled else 'permitted'})\n")
          # Five fields. Each observed value rides along so the CI annotation
          # can say which of false, absent, null or wrong-typed actually
          # occurred, instead of collapsing every misconfiguration into one word.
          print("|".join([
              str(reviewers_found),
              "true" if self_review_enabled else "false",
              wire(self_review_shown),
              "true" if admins_bypass_disabled else "false",
              wire(admins_shown),
          ]))
          PYTHON
          )" || refuse "the environment response could not be evaluated into a reviewer count."

          IFS='|' read -r REVIEWERS SELF_REVIEW SELF_REVIEW_VALUE ADMINS_DISABLED ADMINS_VALUE <<<"${FACTS}"

          # Guard the comparison itself. `[ x -lt 1 ]` returns 2 on a
          # non-numeric operand, and inside an `if` condition that skips the
          # body rather than refusing, so a malformed count would otherwise
          # walk straight past the gate.
          case "${REVIEWERS}" in
              ''|*[!0-9]*) refuse "internal error: reviewer count was not a non-negative integer ('${REVIEWERS}')." ;;
          esac

          if [ "${REVIEWERS}" -lt 1 ]; then
            refuse "environment '${ENV_NAME}' has no required reviewers configured, so this job would be self-authorising while appearing to be gated."
          fi
          if [ "${SELF_REVIEW}" != "true" ]; then
            refuse "environment '${ENV_NAME}' has required reviewers but does NOT enforce independent approval: its required-reviewers rule reports prevent_self_review=${SELF_REVIEW_VALUE}. Without it, whoever dispatched this run could approve their own destructive migration. Enable 'Prevent self-review' on the '${ENV_NAME}' environment."
          fi
          if [ "${ADMINS_DISABLED}" != "true" ]; then
            refuse "environment '${ENV_NAME}' does NOT forbid administrator bypass: it reports can_admins_bypass=${ADMINS_VALUE}. Repository admins can override protection rules and force a deployment to this environment, which makes the required-reviewers rule advisory rather than binding. De-select 'Allow administrators to bypass configured protection rules' on the '${ENV_NAME}' environment."
          fi
          echo "Required reviewers are configured (${REVIEWERS}), self-review is prevented,"
          echo "and administrators cannot bypass the protection rules."
          echo "Approval must come from a reviewer other than the person who dispatched this run."

      - name: Destructive migration (backup-approved)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /home/deployer/FrameIQ

            # Re-verify, immediately before the destructive step, that the CI
            # run for this exact SHA concluded success. Approval must not be
            # usable to run unreviewed code.
            VERIFIED_SHA="${{ inputs.ref }}"
            ACTUAL="$(git rev-parse HEAD)"
            if [ "$ACTUAL" != "$VERIFIED_SHA" ]; then
              echo "::error::VPS is at $ACTUAL but $VERIFIED_SHA was approved."
              exit 1
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::VPS working tree is dirty; refusing to migrate."
              exit 1
            fi

            docker compose build web

            # ── Preconditions re-checked immediately before the DROP ───
            BACKUP_REF="${{ inputs.backup_ref }}"
            VERIFIED_BY="${{ inputs.backup_verified_by }}"
            MIGRATION="${{ inputs.destructive_migration }}"

            if [ -z "$BACKUP_REF" ] || [ -z "$VERIFIED_BY" ]; then
              echo "::error::Backup reference or verifier is empty; refusing."
              exit 1
            fi
            if [ ${#BACKUP_REF} -lt 8 ]; then
              echo "::error::Backup reference is too short to identify a snapshot."
              exit 1
            fi

            echo "Destructive migration authorised:"
            echo "  migration    : $MIGRATION"
            echo "  backup_ref   : $BACKUP_REF"
            echo "  verified_by  : $VERIFIED_BY"
            echo "The legacy table is dropped only after every source row is accounted for."

            SKIP_SCHEMA_GUARD=1 docker compose run --rm --no-deps web \
              python scripts/migrate.py upgrade --allow-production \
              --only "$MIGRATION" \
              --authorize-destructive "$MIGRATION" \
              --backup-ref "$BACKUP_REF" \
              --backup-verified-by "$VERIFIED_BY"

            # Prove convergence before anything else touches the app.
            docker compose run --rm --no-deps web python -m utils.schema_guard

            echo "DESTRUCTIVE MIGRATION COMPLETE AND VERIFIED."
